[project]
name = "allenco-glean-connector"
version = "0.1.0"
description = "Allen & Co Glean custom connector (indexer) + custom action, over Azure SQL Managed Instance."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-dotenv>=1.0.0",
  "glean-api-client>=0.11.27",
  "psutil>=7.2.2",
  "pyodbc>=5.0.0",
  "pandas>=2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
# Optional: Azure Blob backend for the incremental sync-state store (prod indexer).
azure = [
  "azure-storage-blob>=12.19",
  "azure-identity>=1.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults (Depends/Query/... in argument defaults)
# are idiomatic and safe — exempt them from B008.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Header",
  "fastapi.Security",
]
