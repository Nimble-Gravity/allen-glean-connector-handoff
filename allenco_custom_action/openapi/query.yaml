openapi: "3.0.3"

# NOTE: description fields are PROMPTS for the Glean agent. Examples are
# illustrative — refine per the real EMS columns. Replace servers[0].url with the
# deployed API host before go-live.

info:
  title: "Allen & Co EMS — View Query"
  version: "1.0.0"
  description: |
    Use this action to retrieve actual data rows from the Allen & Co EMS views.

    **Use this action when the user asks for specific data:**
    - "Show me the attendees for company X at conference Y."
    - "List the flights for attendee Z."
    - "Which companies are registered for event 3?"
    - Range/date questions: "travel updated between two dates."
    - Partial-text questions: "companies whose name contains 'Capital'."

    **Do NOT use this action when:**
    - The user only wants to know what views exist → use the EMS Schema Explorer
      with `show_all_views=true`.
    - The user wants to know a view's columns → use the Schema Explorer with
      `show_view_columns`.
    - You do not know the exact view name or filter column name.
    - The answer is already in the indexed documents (summaries).

    **Views in scope (rpt schema):** v_EventInstance_Attendee (conference
    registration: IDs + company), v_Catering_TableAssignment (seating, carries the
    person's FormalName), v_Activity_Attendee_TimeRange, v_TravelAir (flights),
    v_TravelGround (ground transport). Common keys across views: AttendeeID,
    EventInstanceID. Use the Schema Explorer to confirm exact column names.

    **Filtering:** use `filters` (a JSON array) for one or more conditions combined
    with AND — equality, ranges, dates, IN-lists, and partial-text match. The older
    `filter_by_column`/`filter_value` pair is a single-equality shortcut.

    **Row limit:** defaults to 500 rows; set `limit` to any positive integer for more.

servers:
  - url: "https://SERVER_HOST"

paths:
  /query:
    get:
      operationId: "queryEmsDatabaseView"
      summary: "Query data rows from an Allen & Co EMS view, with optional column filter"
      description: |
        The server verifies the view exists before running the query (404 if not).
        Result: `data` (array of row objects) and `row_count`. If `row_count`
        equals `limit`, more data may exist — increase `limit` or add a filter.
      parameters:
        - in: query
          name: user_email
          required: true
          schema:
            type: string
            format: email
            example: "jane.doe@allenandco.com"
          x-glean-typehint: EmailAddress
          description: |
            Email of the authenticated Glean user. Always populate with the current
            user's email. Used for audit logging and AD/Entra permission checks.

        - in: query
          name: view_name
          required: true
          schema:
            type: string
            example: "v_EventInstance_Attendee"
          description: |
            Exact name of the view to query. Letters, digits, and underscores only.
            If unknown, call the Schema Explorer with `show_all_views=true` first.

        - in: query
          name: filters
          required: false
          schema:
            type: string
            example: '[{"column":"CompanyName","op":"contains","value":"Capital"},{"column":"EventInstanceID","op":"eq","value":"3"}]'
          description: |
            Preferred way to filter. A JSON array of condition objects, combined with
            AND. Each object is {"column": <name>, "op": <operator>, "value": <value>}.
            Column names must be letters/digits/underscores (confirm with the Schema
            Explorer). Every value is passed as a bound SQL parameter — never
            interpolated.

            Operators (`op`) and the `value` each expects:
            - eq, ne, gt, gte, lt, lte → a single scalar value.
              e.g. {"column":"EventInstanceID","op":"eq","value":"3"}
            - between → a list of exactly two values [low, high] (numbers or dates).
              e.g. {"column":"UpdatedOn","op":"between","value":["2026-01-01","2026-01-31"]}
            - in → a non-empty list of values.
              e.g. {"column":"AttendeeCodeType","op":"in","value":["Institutional","Corporate"]}
            - is_null, is_not_null → no `value`.
            - contains, startswith, endswith → a single string; matched
              case-as-stored with the user's wildcards treated literally.
              e.g. {"column":"CompanyName","op":"contains","value":"Capital"}

            Dates/datetimes: pass as ISO strings (e.g. "2026-01-31"); the database
            compares them against the column's real type. Only AND is supported (no
            OR). Omit `filters` to return all rows (subject to `limit`).

        - in: query
          name: filter_by_column
          required: false
          schema:
            type: string
            example: "EventInstanceID"
          description: |
            Single-equality shortcut (legacy). Prefer `filters` for multiple or
            non-equality conditions. Exact column name; letters, digits, and
            underscores only. Must be provided together with `filter_value`. Ignored
            when `filters` is supplied.

        - in: query
          name: filter_value
          required: false
          schema:
            type: string
            example: "3"
          description: |
            Value to match in `filter_by_column` (exact equality). Always passed as a
            bound SQL parameter — never interpolated. Requires `filter_by_column`.

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            default: 500
            example: 1000
          description: "Maximum rows to return (default 500, no server cap)."

        - in: query
          name: sort_by_column
          required: false
          schema:
            type: string
            example: "CompanyName"
          description: |
            Column to sort by. Letters, digits, and underscores only. If omitted,
            a stable but unspecified order is used.

        - in: query
          name: sort_order
          required: false
          schema:
            type: string
            enum: ["asc", "desc"]
            default: "asc"
            example: "desc"
          description: "Sort direction; requires sort_by_column."

        - in: query
          name: select_columns
          required: false
          schema:
            type: string
            example: "AttendeeID,CompanyName,AttendeeCode"
          description: |
            Comma-separated columns to include. Each must be letters/digits/underscores.
            If omitted, all columns are returned. Ignored when distinct_column is set.

        - in: query
          name: distinct_column
          required: false
          schema:
            type: string
            example: "CompanyName"
          description: |
            Distinct-values mode: returns the unique non-null values in this column,
            sorted. Letters, digits, and underscores only. filter_by_column/filter_value
            can still scope the distinct values.

      responses:
        '200':
          description: "Query executed successfully."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              examples:
                with_rows:
                  value:
                    data:
                      - AttendeeID: 101
                        EventInstanceID: 3
                        CompanyName: "Maverick Capital, Ltd."
                        AttendeeCode: "Institutional"
                    row_count: 1
                empty_result:
                  value:
                    data: []
                    row_count: 0
        '400':
          description: "Bad request (invalid identifier, missing view_name, invalid limit, etc.)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_view_name:
                  value:
                    detail: "view_name must contain only letters, digits, and underscores."
                invalid_sort_order:
                  value:
                    detail: "sort_order must be 'asc' or 'desc'."
        '403':
          description: "The user is not permitted to access the requested view."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "The user does not have permission to access this view."
        '404':
          description: "The view in `view_name` does not exist."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "View 'v_NonExistent' not found."
        '500':
          description: "Database connection error or unexpected internal server error."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Database error. Please try again later."

components:
  schemas:
    QueryResponse:
      type: object
      required:
        - data
        - row_count
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
          description: |
            Array of result rows. Each element is a flat object keyed by column name.
            Types reflect the SQL column type; datetimes are ISO 8601 strings.
          example:
            - AttendeeID: 101
              EventInstanceID: 3
              CompanyName: "Maverick Capital, Ltd."
        row_count:
          type: integer
          description: "Number of rows returned. If equal to `limit`, more may exist."
          example: 1

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          description: |
            Error description. A string for server errors (404, 500), or a list of
            validation error objects for request errors (400).
      additionalProperties: true
